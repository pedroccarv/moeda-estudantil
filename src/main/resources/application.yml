spring:
  application:
    name: moeda-estudantil
  datasource:
    url: jdbc:postgresql://localhost:5432/moeda_estudantil
    username: moeda
    password: moeda123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
