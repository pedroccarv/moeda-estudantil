<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="topbar" class="topbar">
    <a class="brand" th:href="@{/}">Moeda Estudantil</a>
    <nav>
        <a th:href="@{/alunos}">Alunos</a>
        <a th:href="@{/empresas}">Empresas</a>
    </nav>
</header>

<div th:fragment="alerts">
    <div th:if="${sucesso}" class="alert ok" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert err" th:text="${erro}"></div>
</div>
</body>
</html>
