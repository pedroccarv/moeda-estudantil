<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Extrato do professor</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <div class="card">
        <h1>Extrato</h1>
        <p>Saldo atual</p>
        <p class="saldo" th:text="${professor.saldoMoedas} + ' moedas'">0</p>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>Data</th><th>Valor</th><th>Aluno</th><th>Motivo</th></tr>
                </thead>
                <tbody>
                <tr th:each="t : ${envios}">
                    <td th:text="${#temporals.format(t.dataHora, 'dd/MM/yyyy HH:mm')}">data</td>
                    <td th:text="${t.valor}">0</td>
                    <td th:text="${t.aluno.nome}">aluno</td>
                    <td th:text="${t.motivo}">motivo</td>
                </tr>
                <tr th:if="${#lists.isEmpty(envios)}">
                    <td colspan="4" class="muted">Nenhum envio.</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments :: emails}"></div>
    </div>
</main>
</body>
</html>
