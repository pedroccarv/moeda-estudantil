<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Painel do professor</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <div class="card">
        <h1 th:text="${professor.nome}">Professor</h1>
        <p class="muted" th:text="${professor.departamento + ' · ' + professor.instituicao.nome}">Departamento</p>
        <p>Saldo</p>
        <p class="saldo" th:text="${professor.saldoMoedas} + ' moedas'">0</p>
        <p class="muted">A cada semestre o sistema soma 1.000 moedas ao saldo. Semestre reconhecido:
            <span th:text="${professor.ultimoPeriodoCreditado != null ? professor.ultimoPeriodoCreditado : 'ainda não creditado'}">2026-2</span>
        </p>
        <div class="actions">
            <a class="btn" th:href="@{/professor/enviar}">Enviar moedas</a>
            <a class="btn secondary" th:href="@{/professor/extrato}">Ver extrato</a>
        </div>
    </div>
</main>
</body>
</html>
