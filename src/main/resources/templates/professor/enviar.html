<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Enviar moedas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <div class="card">
        <h1>Enviar moedas</h1>
        <p>Saldo disponível: <strong th:text="${professor.saldoMoedas}">0</strong></p>
        <form th:action="@{/professor/enviar}" method="post" class="form-grid">
            <label for="alunoId">Aluno</label>
            <select id="alunoId" name="alunoId" required>
                <option value="">Selecione...</option>
                <option th:each="a : ${alunos}"
                        th:value="${a.id}"
                        th:text="${a.nome + ' — ' + a.curso + ' (' + a.instituicao.nome + ')'}"
                        th:selected="${alunoId != null and alunoId == a.id}"></option>
            </select>

            <label for="valor">Quantidade</label>
            <input id="valor" name="valor" type="number" min="1" required th:value="${valor}"/>

            <label for="motivo">Motivo</label>
            <textarea id="motivo" name="motivo" maxlength="500" required th:text="${motivo}"></textarea>

            <div class="actions">
                <button class="btn" type="submit" th:disabled="${#lists.isEmpty(alunos)}">Enviar</button>
                <a class="btn secondary" th:href="@{/professor}">Cancelar</a>
            </div>
        </form>
        <p th:if="${#lists.isEmpty(alunos)}" class="muted">Nenhum aluno cadastrado ainda.</p>
    </div>
</main>
</body>
</html>
