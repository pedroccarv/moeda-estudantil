<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Entrar</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <div class="card">
        <h1>Entrar</h1>
        <form th:action="@{/login}" method="post" class="form-grid">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required th:value="${email}"/>

            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" required/>

            <div class="actions">
                <button class="btn" type="submit">Entrar</button>
            </div>
        </form>
        <p class="muted">Ainda não tem conta?
            <a th:href="@{/alunos/novo}">Cadastre-se como aluno</a>
            ou
            <a th:href="@{/empresas/nova}">como empresa</a>.
        </p>
        <p class="muted">Professores de demonstração (senha <strong>prof123</strong>):
            ana.souza@pucminas.br e carlos.lima@ufmg.br.</p>
    </div>
</main>
</body>
</html>
