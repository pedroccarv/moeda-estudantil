<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Vantagens</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <div class="card">
        <h1>Vantagens</h1>
        <p>Seu saldo: <strong th:text="${aluno.saldoMoedas} + ' moedas'">0</strong></p>
        <div class="cards">
            <article class="card" th:each="v : ${vantagens}">
                <img class="foto" th:src="@{${v.fotoUrl}}" alt="Foto da vantagem"/>
                <h2 th:text="${v.descricao}">Descrição</h2>
                <p class="muted" th:text="${v.empresa.nome}">Empresa</p>
                <p th:text="${v.custoEmMoedas} + ' moedas'">0</p>
                <p class="muted" th:if="${aluno.saldoMoedas < v.custoEmMoedas}">Saldo insuficiente para esta vantagem.</p>
                <form th:action="@{/aluno/vantagens/{id}/resgatar(id=${v.id})}" method="post"
                      onsubmit="return confirm('Resgatar esta vantagem?');">
                    <button class="btn" type="submit">Resgatar</button>
                </form>
            </article>
        </div>
        <p th:if="${#lists.isEmpty(vantagens)}" class="muted">Nenhuma vantagem cadastrada ainda.</p>
    </div>
</main>
</body>
</html>
