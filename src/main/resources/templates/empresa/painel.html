<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Painel da empresa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <div class="card">
        <h1 th:text="${empresa.nome}">Empresa</h1>
        <p class="muted" th:text="${empresa.email}">email</p>
        <div class="actions">
            <a class="btn" th:href="@{/empresa/vantagens/nova}">Nova vantagem</a>
            <a class="btn secondary" th:href="@{/empresas/{id}/editar(id=${empresa.id})}">Editar cadastro</a>
        </div>

        <h2>Vantagens</h2>
        <div class="cards">
            <article class="card" th:each="v : ${vantagens}">
                <img class="foto" th:src="@{${v.fotoUrl}}" alt="Foto da vantagem"/>
                <h2 th:text="${v.descricao}">Descrição</h2>
                <p th:text="${v.custoEmMoedas} + ' moedas'">0</p>
                <div class="actions">
                    <a class="btn secondary" th:href="@{/empresa/vantagens/{id}/editar(id=${v.id})}">Editar</a>
                    <form class="inline-form" th:action="@{/empresa/vantagens/{id}/excluir(id=${v.id})}" method="post"
                          onsubmit="return confirm('Excluir esta vantagem?');">
                        <button class="btn danger" type="submit">Excluir</button>
                    </form>
                </div>
            </article>
        </div>
        <p th:if="${#lists.isEmpty(vantagens)}" class="muted">Nenhuma vantagem cadastrada. Inclua descrição, foto e custo em moedas.</p>

        <h2>Resgates para conferência</h2>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>Data</th><th>Aluno</th><th>Vantagem</th><th>Cupom</th></tr>
                </thead>
                <tbody>
                <tr th:each="r : ${resgates}">
                    <td th:text="${#temporals.format(r.dataHora, 'dd/MM/yyyy HH:mm')}">data</td>
                    <td th:text="${r.aluno.nome}">aluno</td>
                    <td th:text="${r.vantagem.descricao}">vantagem</td>
                    <td class="cupom" th:text="${r.codigoCupom}">CODIGO</td>
                </tr>
                <tr th:if="${#lists.isEmpty(resgates)}">
                    <td colspan="4" class="muted">Nenhum resgate ainda.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments :: emails}"></div>

        <form th:action="@{/empresas/{id}/excluir(id=${empresa.id})}" method="post"
              onsubmit="return confirm('Excluir o cadastro da empresa?');">
            <button class="btn danger" type="submit">Excluir meu cadastro</button>
        </form>
    </div>
</main>
</body>
</html>
