<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Vantagem</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <div class="card">
        <h1 th:text="${vantagem == null} ? 'Nova vantagem' : 'Editar vantagem'">Vantagem</h1>
        <form th:action="@{/empresa/vantagens/salvar}" method="post" enctype="multipart/form-data" class="form-grid">
            <input type="hidden" name="id" th:if="${vantagem != null}" th:value="${vantagem.id}"/>

            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" maxlength="500" required
                      th:text="${vantagem?.descricao}"></textarea>

            <label for="custoEmMoedas">Custo em moedas</label>
            <input id="custoEmMoedas" name="custoEmMoedas" type="number" min="1" required
                   th:value="${vantagem?.custoEmMoedas}"/>

            <label for="foto">Foto do produto</label>
            <img th:if="${vantagem != null}" class="foto" th:src="@{${vantagem.fotoUrl}}" alt="Foto atual"/>
            <input id="foto" name="foto" type="file" accept="image/png,image/jpeg,image/webp,image/gif"
                   th:required="${vantagem == null}"/>

            <div class="actions">
                <button class="btn" type="submit">Salvar</button>
                <a class="btn secondary" th:href="@{/empresa}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
