<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Moeda Estudantil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<main class="container">
    <div class="card">
        <h1>Sistema de Moeda Estudantil</h1>
        <p>Professores distribuem moedas aos alunos como reconhecimento. O aluno troca essas moedas por vantagens de empresas parceiras.</p>
        <div class="actions">
            <a class="btn" th:href="@{/login}">Entrar</a>
            <a class="btn secondary" th:href="@{/alunos/novo}">Cadastrar aluno</a>
            <a class="btn secondary" th:href="@{/empresas/nova}">Cadastrar empresa</a>
        </div>
        <p class="muted">Professores já entram com a conta enviada pela instituição. Alunos e empresas se cadastram aqui.</p>
    </div>
</main>
</body>
</html>
