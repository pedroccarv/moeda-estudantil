services:
  postgres:
    image: postgres:16-alpine
    container_name: moeda-estudantil-db
    environment:
      POSTGRES_DB: moeda_estudantil
      POSTGRES_USER: moeda
      POSTGRES_PASSWORD: moeda123
    ports:
      - "5432:5432"
    volumes:
      - moeda_pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  moeda_pgdata:
